name: Auto Deploy to VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: SSH into VPS and deploy tgsoft-frontend-shop
        uses: appleboy/ssh-action@v1.1.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_KEY }}
          script: |
            # Bật debug để log chi tiết
            set -x

            echo "📌 Tạo folder .ssh và thêm VPS vào known_hosts nếu chưa có"
            mkdir -p ~/.ssh
            ssh-keyscan -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts

            echo "📂 Điều hướng đến project folder"
            mkdir -p /root/tgsoft-frontend-shop
            cd /root/tgsoft-frontend-shop

            echo "🔄 Đồng bộ code với main branch"
            git fetch origin main
            git reset --hard origin/main
            git status

            echo "🐳 Rebuild Docker containers"
            docker-compose down || true
            docker-compose up -d --build

            echo "✅ Deployment hoàn tất!"
