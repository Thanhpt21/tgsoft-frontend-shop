name: Auto Deploy to VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: SSH into VPS and deploy tgsoft-frontend-shop
        uses: appleboy/ssh-action@v1.1.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_KEY }}
          script: |
            set -x
            echo "📂 Navigate to project folder..."
            mkdir -p /root/tgsoft-frontend-shop
            cd /root/tgsoft-frontend-shop

            echo "🔄 Sync code from main..."
            git fetch origin main
            git reset --hard origin/main
            git status

            echo "🐳 Rebuild Docker containers..."
            docker-compose down || true
            docker-compose up -d --build

            echo "✅ Deployment finished!"
